name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Icarus Verilog and model dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          python -m pip install numpy pillow
      - name: Every testbench, plus full-frame comparison against the golden model
        run: make
